<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080817">
<title>The Art of Loving You — By Ali</title>
<style>
:root{--bg:#080817;--ink:#f7f3ff;--muted:#b9b2d0;--pink:#ffb5d2;--gold:#f8d9a0;--line:#ffffff20}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}body{overflow-x:hidden;background:radial-gradient(ellipse at 50% 110%,#30204b 0,#111027 42%,#080817 78%)}button{font:inherit;color:inherit}.stars,.stars:before,.stars:after{position:fixed;inset:0;pointer-events:none;content:"";background-image:radial-gradient(1px 1px at 12% 22%,#fff 98%,transparent),radial-gradient(1px 1px at 72% 18%,#ffdce9 98%,transparent),radial-gradient(1.5px 1.5px at 43% 76%,#fff 98%,transparent),radial-gradient(1px 1px at 88% 63%,#fff 98%,transparent),radial-gradient(1px 1px at 24% 84%,#ffe2ef 98%,transparent);background-size:370px 310px;opacity:.65;animation:drift 45s linear infinite}.stars:before{transform:scale(1.4);opacity:.35;animation-duration:70s}.stars:after{transform:scale(1.9);opacity:.2;animation-duration:100s}@keyframes drift{to{transform:translate3d(-35px,25px,0)}}.aurora{position:fixed;width:70vw;height:70vw;max-width:900px;max-height:900px;left:50%;top:42%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#9b5d9d20 0,#6e4c9b10 38%,transparent 68%);filter:blur(16px);pointer-events:none}.wrap{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:22px 18px 30px}.top{width:min(100%,900px);display:flex;align-items:center;justify-content:space-between;color:#d7cce8;font:11px/1.4 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.brand{opacity:.82}.sound{border:1px solid var(--line);background:#ffffff0b;border-radius:30px;padding:10px 14px;font:11px Arial,sans-serif;letter-spacing:.1em;cursor:pointer}.sound.on{border-color:#ffc2dc88;color:var(--pink)}main{width:min(100%,760px);flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 0 30px}.panel{width:100%;animation:appear .9s ease both}@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font:10px Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--pink);margin-bottom:24px}.orb{width:clamp(110px,23vw,180px);aspect-ratio:1;border-radius:50%;margin:0 auto 30px;position:relative;background:radial-gradient(circle at 38% 35%,#fff8 0 1%,#f8c4e8aa 2%,#c28bdc55 18%,#7754aa22 48%,transparent 70%);box-shadow:0 0 45px #d69be855,0 0 110px #9e74d333;animation:pulse 5s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;inset:-12%;border:1px solid #f4c8e955;border-radius:50%;transform:rotate(-24deg) scaleY(.38)}.orb:after{transform:rotate(58deg) scaleY(.32);border-color:#e9c4ff44}@keyframes pulse{50%{transform:scale(1.07);filter:brightness(1.18)}}h1{font-weight:400;font-size:clamp(34px,8vw,68px);line-height:1.05;letter-spacing:-.035em;margin:0 auto 20px;max-width:700px;text-wrap:balance}h1 em{color:var(--pink);font-weight:400}.copy{font-size:clamp(16px,3.6vw,20px);line-height:1.8;color:#d6cfe2;max-width:560px;margin:0 auto;white-space:pre-line}.tiny{font:11px Arial,sans-serif;letter-spacing:.12em;color:#9d94b2;margin-top:26px}.actions{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:34px}.primary,.secondary{border-radius:40px;padding:14px 23px;cursor:pointer;transition:.25s}.primary{border:1px solid #f8c5dc99;background:linear-gradient(110deg,#f6c1d7,#e6c6ef);color:#27172c;box-shadow:0 8px 35px #e9a9d52b}.primary:hover{transform:translateY(-2px);box-shadow:0 12px 45px #e9a9d555}.secondary{border:1px solid var(--line);background:#ffffff08;color:#e9e1f2}.secondary:hover{background:#ffffff15}.progress{width:min(100%,520px);margin:0 auto 18px;display:flex;align-items:center;gap:12px;font:10px Arial,sans-serif;letter-spacing:.14em;color:#a69bb9}.track{height:2px;background:#ffffff20;flex:1;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#c68ab9,#ffe0d4);transition:width .4s}.bottom{width:min(100%,900px);display:flex;align-items:center;justify-content:space-between;color:#827991;font:10px Arial,sans-serif;letter-spacing:.12em}.dots{display:flex;gap:5px}.dot{width:4px;height:4px;border-radius:50%;background:#ffffff30}.dot.active{background:var(--pink);box-shadow:0 0 8px var(--pink)}.thoughts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:560px;margin:25px auto 0}.thought{padding:15px 12px;border:1px solid #ffffff20;background:linear-gradient(135deg,#ffffff0c,#ffffff04);border-radius:14px;color:#e9d9eb;font-size:14px;line-height:1.45;cursor:pointer;min-height:66px;transition:.25s}.thought:hover,.thought.open{border-color:#f6b9d777;background:#d69bc51a;color:#fff}.thought span{display:none}.thought.open span{display:block;margin-top:8px;color:#c7b8d5;font-size:12px}.final-note{padding:25px;border:1px solid #f5c4dc44;background:linear-gradient(145deg,#ffffff0d,#d99cc00a);border-radius:22px;max-width:560px;margin:26px auto 0;box-shadow:0 15px 70px #0003}.final-note p{color:#e8ddeb;line-height:1.8;margin:0}.hide{display:none!important}@media(max-width:430px){.wrap{padding:17px 15px 22px}.top{font-size:9px}.thoughts{gap:8px}.thought{font-size:12px;padding:12px 9px}.bottom{font-size:9px}}
</style></head>
<body><div class="stars"></div><div class="aurora"></div><div class="wrap">
<header class="top"><div class="brand">A little universe · by Ali</div><button class="sound" id="soundBtn" aria-label="Toggle background music">♫ SOUND OFF</button></header>
<main><section class="panel" id="panel"><div class="orb"></div><div class="eyebrow">A story told softly</div><h1>Some feelings are<br><em>bigger than words.</em></h1><p class="copy">A little universe, made of moments, thoughts, and a truth I've been carrying.</p><div class="actions"><button class="primary" id="begin">Step inside <span>↗</span></button></div><div class="tiny">BEST EXPERIENCED WITH SOUND · TAKE YOUR TIME</div></section></main>
<footer class="bottom"><span id="chapterLabel">A NOTE FROM ALI</span><div class="dots" id="dots"></div><span id="count">INTRO</span></footer></div>
<audio id="bgMusic" src="romantic.mp3" loop preload="none"></audio><audio id="confession" src="Areshey_Final_Reveal.mp3" preload="metadata"></audio>
<script>
const scenes=[
['The first light','Some people arrive quietly, and somehow the world feels a little different after them.'],['A little universe','I wanted to make a small place where every detail says what ordinary words sometimes cannot.'],['The pause','Not every beautiful thing needs to be loud. Some things are felt in the silence between words.'],['Unsaid things','There are thoughts I have carried gently, waiting for the right moment to give them a voice.'],['Your own orbit','You have your own dreams, your own pace, and a whole universe that belongs to you.'],['Small details','Sometimes it is the smallest details that stay with us the longest.'],['The quiet chapters','Not every chapter needs a grand event. Some are made of ordinary moments that matter.'],['A sky of memories','Imagine every kind thought as a tiny light, finding its place in an endless sky.'],['The honest part','This is not a perfect story. It is simply an honest one, made with care.'],['Twenty little lights','Tap each little thought. Open them slowly; there is no rush.'],['A little wonder','Wonder is a lovely thing. It lets the heart stay curious without asking for anything back.'],['The distance','Even when two people see the world differently, kindness can still make a bridge.'],['No script','I did not want this to sound rehearsed. I wanted it to feel real.'],['The softest truth','A sincere feeling does not need to demand an answer. It can simply be shared.'],['A thousand colours','Some people remind us that the world has more shades than we noticed before.'],['The things I admire','I admire the things that make you uniquely you — the parts no one else can copy.'],['A wish','I wish you peace on difficult days, laughter on ordinary ones, and room to become everything you hope to be.'],['The open door','This is an open door, not an expectation. You are always free to choose your own path.'],['Before the words','There is one last thing I wanted to share, in my own voice.'],['A quiet thank you','Thank you for being part of the moments that inspired this little universe.'],['Almost there','Take a breath. The next part is more personal, and it comes directly from me.'],['The room grows quiet','Let the noise fade for a moment. Nothing here needs to be hurried.'],['One honest moment','I made this because some feelings deserve a little more care than a quick message.'],['If you want to listen','Only if you feel like it, you can hear the words and melody I recorded for you.'],['Beyond words','Whatever you feel after this, I hope you know it was shared with sincerity and respect.']
];let current=-1;const panel=document.getElementById('panel'),dots=document.getElementById('dots'),music=document.getElementById('bgMusic'),conf=document.getElementById('confession'),soundBtn=document.getElementById('soundBtn');
function makeDots(){dots.innerHTML='';for(let i=0;i<25;i++){let d=document.createElement('i');d.className='dot'+(i===current?' active':'');dots.appendChild(d)}}
function render(){let s=scenes[current];document.getElementById('chapterLabel').textContent='CHAPTER '+String(current+1).padStart(2,'0');document.getElementById('count').textContent=(current+1)+' / 25';makeDots();let extra='';if(current===9){let thoughts=['Your kindness','Your individuality','Your quiet strength','Your dreams','Your smile','Your curiosity','Your honesty','Your own pace','Your perspective','Your little victories','Your courage','Your creativity','Your thoughtful side','Your independence','Your warmth','Your patience','Your sense of wonder','Your resilience','Your authenticity','Simply being you'];extra='<div class="thoughts">'+thoughts.map((t,i)=>`<button class="thought" type="button">${String(i+1).padStart(2,'0')} · ${t}<span>A little detail worth appreciating, with no expectation attached.</span></button>`).join('')+'</div>'}
let final=current===24?'<div class="final-note"><p>This last part is in my own voice. Listen only if you want to. There is no pressure, and no answer is expected.</p><div class="actions"><button class="primary" id="playConfession">▶ Play my confession</button></div><p id="audioStatus" class="tiny">YOUR CHOICE, ALWAYS.</p></div>':'';
panel.innerHTML=`<div class="orb"></div><div class="eyebrow">A story told softly · ${String(current+1).padStart(2,'0')}</div><h1>${s[0]}</h1><p class="copy">${s[1]}</p>${extra}${final}<div class="actions"><button class="secondary" id="back" ${current===0?'disabled':''}>← Back</button><button class="primary" id="next">${current===24?'Return to beginning':'Continue →'}</button></div>`;
document.getElementById('back').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>current===24?go(-1):go(current+1);panel.querySelectorAll('.thought').forEach(b=>b.onclick=()=>b.classList.toggle('open'));let play=document.getElementById('playConfession');if(play)play.onclick=async()=>{try{await conf.play();document.getElementById('audioStatus').textContent='PLAYING · TAKE YOUR TIME';play.textContent='Ⅱ Pause confession';play.onclick=()=>{conf.pause();play.textContent='▶ Play my confession';document.getElementById('audioStatus').textContent='PAUSED'}}catch(e){document.getElementById('audioStatus').textContent='Check that Areshey_Final_Reveal.mp3 is uploaded beside index.html.'}};}
function go(n){current=n;if(n<0){current=-1;document.getElementById('chapterLabel').textContent='A NOTE FROM ALI';document.getElementById('count').textContent='INTRO';dots.innerHTML='';panel.innerHTML='<div class="orb"></div><div class="eyebrow">A story told softly</div><h1>Some feelings are<br><em>bigger than words.</em></h1><p class="copy">A little universe, made of moments, thoughts, and a truth I\'ve been carrying.</p><div class="actions"><button class="primary" id="begin">Step inside ↗</button></div><div class="tiny">BEST EXPERIENCED WITH SOUND · TAKE YOUR TIME</div>';document.getElementById('begin').onclick=()=>go(0);return;}render();window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('begin').onclick=()=>go(0);soundBtn.onclick=async()=>{if(music.paused){try{await music.play();soundBtn.textContent='♫ SOUND ON';soundBtn.classList.add('on')}catch(e){soundBtn.textContent='♫ TAP AGAIN'}}else{music.pause();soundBtn.textContent='♫ SOUND OFF';soundBtn.classList.remove('on')}};
conf.addEventListener('ended',()=>{let st=document.getElementById('audioStatus');if(st)st.textContent='THANK YOU FOR LISTENING.'});
</script></body></html>
